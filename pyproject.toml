[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-ai-tutor"
version = "0.1.0"
description = "Tutor educacional de Matemática e Física com Streamlit e OpenAI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Axl Andrade" }]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
math-ai-tutor = "cli_chat:main"

[tool.setuptools]
py-modules = [
    "cli_chat",
    "core",
    "pedagogical_profile",
    "subjects",
    "web_app",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
